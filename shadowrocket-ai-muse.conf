# FQ client rules, 2026-11-10. No node credentials are included.
# Import the five nodes first; preserve their exact names.
# This is a separate local rule config, not a node subscription URL.

[General]
dns-server = system

[Proxy Group]
AI-Auto = url-test, JP-vless-reality, SG-Direct, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=10
AI = select, AI-Auto, JP-vless-reality, SG-Direct, policy-select-name=AI-Auto
Muse = select, SG-Direct, JP-vless-reality, US-Direct, HK-via-US, policy-select-name=SG-Direct
General = url-test, JP-vless-reality, SG-Direct, HK-Direct, US-Direct, HK-via-US, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=10
Streaming = select, SG-Direct, JP-vless-reality, HK-Direct, US-Direct, HK-via-US
Apple = select, DIRECT, General, JP-vless-reality, SG-Direct, HK-Direct, US-Direct, policy-select-name=DIRECT

[Rule]
DOMAIN-SUFFIX,jd.com,DIRECT
DOMAIN-SUFFIX,360buyimg.com,DIRECT
DOMAIN-SUFFIX,localhost,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
DOMAIN-SUFFIX,openai.com,AI
DOMAIN-SUFFIX,chatgpt.com,AI
DOMAIN-SUFFIX,oaistatic.com,AI
DOMAIN-SUFFIX,oaiusercontent.com,AI
DOMAIN-SUFFIX,anthropic.com,AI
DOMAIN-SUFFIX,claude.ai,AI
DOMAIN-SUFFIX,muse.ai,Muse
DOMAIN-SUFFIX,netflix.com,Streaming
DOMAIN-SUFFIX,nflxvideo.net,Streaming
DOMAIN-SUFFIX,youtube.com,General
DOMAIN-SUFFIX,googlevideo.com,General
# blackmatrix7 规则库
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,Apple
